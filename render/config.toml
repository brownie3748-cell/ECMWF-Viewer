# Single configuration file for the ECMWF chart renderer.
# Domains, charts, thresholds and styling all live here.

[data]
model = "ifs"
resolution = "0p25"            # "0p25" now; "0p1" is Stage 3
grid_deg = 0.25
sources = ["ecmwf", "aws", "azure", "google"]   # all sources (M1 measures each)
preferred_source = "aws"
source_order = ["google", "ecmwf", "azure"]      # Stage 1 download order (M1: aws returned 503 on every download)
max_step_main = 240            # 00/12Z runs
max_step_short = 144           # 06/18Z runs
publish_every_h = 6
tp_short_accum_h = 3           # accumulation window for step <= tp_switch_h
tp_long_accum_h = 6            # accumulation window for step > tp_switch_h
tp_switch_h = 144
# Region read from the global grid (with margin around all domains), deg.
read_region = { lat_min = 0.0, lat_max = 60.0, lon_min = 90.0, lon_max = 190.0 }

# Fields fetched per published step (30 fields total).
[[data.groups]]
levtype = "sfc"
param = ["msl", "sp", "tp"]

[[data.groups]]
levtype = "pl"
levelist = [925, 850]
param = ["gh", "t", "u", "v", "q"]

[[data.groups]]
levtype = "pl"
levelist = [700]
param = ["gh", "t", "u", "v", "r"]

[[data.groups]]
levtype = "pl"
levelist = [500, 300, 200]
param = ["gh", "t", "u", "v"]

[domains.default]
lat_min = 25.0
lat_max = 48.0
lon_min = 110.0
lon_max = 140.0
map_width_px = 900
grid_step_deg = 5               # graticule spacing
barb_every = 8                  # grid points between wind barbs
vector_every = 3                # grid points between MFC vectors

[domains.wide]
lat_min = 10.0
lat_max = 50.0
lon_min = 100.0
lon_max = 180.0
map_width_px = 1200
grid_step_deg = 10
barb_every = 12
vector_every = 6

[layout]
dpi = 100
margin_left_px = 56
margin_right_px = 100          # colour-bar slot is always reserved
margin_top_px = 62
margin_bottom_px = 64
colorbar_width_px = 16
colorbar_pad_px = 12

[style]
font_family = "DejaVu Sans"
title_size = 13
label_size = 9
footer_size = 10
credit_size = 7
model_label = "ECMWF IFS 0.25deg"
credit = "Adapted from 'ECMWF IFS 15-day Forecast Data' by ECMWF, CC BY 4.0 (https://data.ecmwf.int/forecasts/). Modified: cropped, derived and rendered."
coast_resolution = "50m"       # Natural Earth: 110m / 50m / 10m
coast_color = "#4d4d4d"
coast_width = 0.65
border_color = "#707070"
border_width = 0.5
coast_color_strong = "#000000"   # over full colour fills (style C)
coast_width_strong = 0.8
border_color_strong = "#1a1a1a"
border_width_strong = 0.6
grid_color = "#999999"
grid_width = 0.4
utc_color = "#d00000"
kst_offset_h = 9

[charts.msl]
title = "Mean Sea Level Pressure (hPa)"
title_with_tp = "MSLP (hPa) and {window}h Precipitation (mm)"
interval = 2
label_every = 4                 # label only isobars that are multiples of this (hPa)
bold_every = 20
hl_window_deg = 5.0             # +/- window for H/L detection
hl_edge_exclude_deg = 1.0

[charts.tp]
title_short = "3h Accumulated Precipitation (mm)"
title_long = "6h Accumulated Precipitation (mm)"
levels = [0.5, 1, 2, 3, 5, 7, 10, 15, 20, 25, 30, 40, 50, 70]
colors = ["#b4e0fb", "#80c4f2", "#4ea3e6", "#2a7fd4", "#1a9e3c",
          "#52c234", "#9ade3c", "#f2e33a", "#f5b52d", "#f27a1f", "#e33a16",
          "#c4161c", "#9b1d6b", "#6c1a8c"]

[charts.gz]
# Height contour interval (gpm) and isotherm interval (deg C) per level.
gh_interval = { 925 = 30, 850 = 30, 700 = 30, 500 = 60, 300 = 120, 200 = 120 }
t_interval = { 925 = 3, 850 = 3, 700 = 3, 500 = 3, 300 = 3, 200 = 3 }
t_fill_range = { 925 = [-30, 30], 850 = [-36, 27], 700 = [-42, 18], 500 = [-51, -3], 300 = [-66, -30], 200 = [-72, -42] }
temp_style = "B"                # default: A = colour fill + colour bar, B = dashed isotherms
# C = fixed rainbow fill (same colour for the same temperature at every level) + white isotherms
temp_style_by_level = { 925 = "C", 850 = "C", 700 = "C", 500 = "A" }
gz500_variants = []             # Stage 0 A/B review done
t_cmap = "RdYlBu_r"
mask_underground = [925, 850]

[charts.gz.wind_fill]
# Wind-speed shading for upper levels; isotherms switch to dark grey dashed lines there.
levels = [300, 200]
step = 5                        # kt
max = 200
isotherm_color = "#3a3a3a"
barb_color = "#1a1a1a"
# speed (kt) -> colour: grey < 50, pale -> deep yellow 50-75, orange 75-100, red 100-150, purple above
anchors = [
  [0, "#ffffff"], [49.9, "#cfcfcf"],
  [50, "#fff4b8"], [75, "#f5c000"],
  [75.1, "#ffbf66"], [100, "#e0620b"],
  [100.1, "#ff6b5b"], [150, "#9e0b0b"],
  [150.1, "#b77fd6"], [200, "#4b1a7a"],
]

# Highlighted isotherm per level (deg C), drawn red over the shading: rain/snow guidance.
[charts.gz.highlight_isotherm]
color = "#e00000"
width = 1.6
levels = { 925 = -5, 850 = -8 }

[charts.gz.fill_c]
step = 1                        # shading interval, deg C
isotherm_color = "#ffffff"
isotherm_width = 0.5
barb_color = "#1a1a1a"
# temperature (deg C) -> colour anchors, interpolated linearly
anchors = [
  [-61, "#f2d4f2"], [-51, "#e077e0"], [-41, "#9b30b8"], [-35, "#6a2fa8"], [-30, "#4b3fb0"],
  [-25, "#3456c6"], [-20, "#2f6fd6"], [-15, "#3a8fe0"], [-10, "#4fb3ea"], [-5, "#56d6ea"],
  [0, "#5fe0c9"], [3, "#3fbf7a"], [5, "#2fae55"], [10, "#1f8f2a"], [13, "#8fc94a"],
  [15, "#d9d65a"], [20, "#f0c050"], [25, "#ec9d3d"], [30, "#d9622a"], [35, "#b8251f"],
  [40, "#8c1a2a"], [45, "#d46aa8"], [48, "#b58fd6"],
]

[charts.rh700]
title = "700hPa Relative Humidity (%) and Geopotential Height (gpm)"
# continuous brown (dry) -> white (~50 %) -> teal/green (moist), like a BrBG scale
step = 5                        # shading interval, %
anchors = [
  [0, "#3d2208"], [10, "#6b3f12"], [20, "#9a6324"], [30, "#c49a5a"], [40, "#e6cf9e"],
  [50, "#f5f0e4"], [60, "#cfe8e2"], [70, "#8ccdbf"], [80, "#3fa392"], [90, "#137a6c"],
  [100, "#00443c"],
]

[charts.mfc]
title = "{level}hPa Moisture Flux(m/s) and Convergence(E-8/s)"
scale = 1e8                     # displayed value = div(qV) * scale (E-8/s, decided after M5)
shade_min = -50
shade_step = 5
shade_colors = ["#f3eefa", "#ddd0f0", "#c2a6e3", "#a97bd6", "#8f55c6",
                "#6f3fb0", "#4b8fd0", "#33c3e6", "#1f7fe0", "#1240b8"]
contour_interval = 10           # positive (divergence) contour interval
contour_color = "#6a6a6a"
contour_width = 0.35
smooth_sigma = 1.0              # gaussian sigma in grid points (0 = off)
vector_color = "#d00000"
vector_ref = 0.1                # m/s reference vector for the key
vector_scale = 6.0              # m/s of flux per map width (larger = shorter arrows)

[wpsh]
level_offset_gpm = 50           # red line at H - offset
search_box = { lat_min = 10.0, lat_max = 40.0, lon_min = 120.0, lon_max = 180.0 }
local_window_deg = 5.0          # candidate = max within +/- window
edge_exclude_deg = 2.0          # drop candidates this close to the box edge
line_color = "#e00000"
line_width = 2.0
run_hours = [0, 12]             # draw the line only for these run hours (06/18Z: no line, decided 2026-11-14)
jump_flag_deg = 10.0            # M4: centre moves larger than this are reported (informational only)
jump_flag_gpm = 40.0            # M4: flag H changes larger than this between consecutive 00/12Z runs

[site]
retention_runs = 12             # newest complete runs kept on the published site (3 days)
lookback_runs = 18              # how many past 6-hourly cycles to consider when polling
workers = 4                     # parallel render processes
path = "{model}/{run}/{chart}_{step:03d}.png"
schema_version = 2
render_version = 5              # bump when chart content changes: runs rendered with an older version are re-rendered
# Published charts, in display order (id, title, level, domain, overlay_of, min_step).
charts = [
  { id = "msl", title = "MSLP + precipitation", domain = "default" },
  { id = "gz925", title = "925hPa", level = 925, domain = "default" },
  { id = "mfc925", title = "925hPa MFC", level = 925, domain = "default" },
  { id = "gz850", title = "850hPa", level = 850, domain = "default" },
  { id = "mfc850", title = "850hPa MFC", level = 850, domain = "default" },
  { id = "gz700", title = "700hPa", level = 700, domain = "default" },
  { id = "rh700", title = "700hPa RH", level = 700, domain = "default" },
  { id = "gz500", title = "500hPa", level = 500, domain = "default" },
  { id = "wpsh500", title = "WPSH line", level = 500, domain = "default", overlay_of = "gz500" },
  { id = "gz500_wide", title = "500hPa wide", level = 500, domain = "wide" },
  { id = "wpsh500_wide", title = "WPSH line (wide)", level = 500, domain = "wide", overlay_of = "gz500_wide" },
  { id = "gz300", title = "300hPa", level = 300, domain = "default" },
  { id = "gz200", title = "200hPa", level = 200, domain = "default" },
]

# ---------------------------------------------------------------------------------------------
# Models. Each model renders with the base config above deep-merged with its `override` table;
# `charts` selects (in display order) which of site.charts it publishes.
[[models]]
id = "ifs"
label = "IFS 0.25°"
charts = "all"
override = {}

[[models]]
id = "ifs01"
label = "IFS 0.1°"
charts = ["msl", "gz925", "mfc925", "gz850", "mfc850", "gz700", "rh700", "gz500", "wpsh500"]
[models.override.data]
resolution = "0p1"
grid_deg = 0.1
[[models.override.data.groups]]
levtype = "sfc"
param = ["msl", "sp", "tp"]
[[models.override.data.groups]]
levtype = "pl"
levelist = [925, 850]
param = ["gh", "t", "u", "v", "q"]
[[models.override.data.groups]]
levtype = "pl"
levelist = [700]
param = ["gh", "t", "u", "v", "r"]
[[models.override.data.groups]]
levtype = "pl"
levelist = [500]
param = ["gh", "t", "u", "v"]
[models.override.domains.default]
barb_every = 20                 # same spacing in degrees as 8 points at 0.25 deg
vector_every = 8
[models.override.charts.mfc]
smooth_sigma = 4.0              # 0.4 deg: 0.1 deg divergence is much noisier than 0.25 deg (smoke render)
[models.override.charts.msl]
smooth_sigma = 2.0              # 0.2 deg gaussian on MSLP before contouring (terrain noise over land)
[models.override.style]
model_label = "ECMWF IFS 0.1deg"

[[models]]
id = "aifs"
label = "AIFS"
charts = "all"
[models.override.data]
model = "aifs-single"
tp_short_accum_h = 6            # AIFS output is 6-hourly only
[[models.override.data.groups]]
levtype = "sfc"
param = ["msl", "sp", "tp"]
[[models.override.data.groups]]
levtype = "pl"
levelist = [925, 850]
param = ["gh", "t", "u", "v", "q"]
[[models.override.data.groups]]
levtype = "pl"
levelist = [700]
param = ["gh", "t", "u", "v", "q"]   # AIFS has no r: 700 hPa RH is derived from q and t
[[models.override.data.groups]]
levtype = "pl"
levelist = [500, 300, 200]
param = ["gh", "t", "u", "v"]
[models.override.style]
model_label = "ECMWF AIFS Single 0.25deg"
credit = "Adapted from 'ECMWF AIFS Single Forecast Data' by ECMWF, CC BY 4.0 (https://data.ecmwf.int/forecasts/). Modified: cropped, derived and rendered."

# ---------------------------------------------------------------------------------------------
# Cloudflare R2 storage (S3 API). Credentials come from the environment: R2_ACCOUNT_ID,
# R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY (GitHub secrets); R2_BUCKET overrides `bucket`.
[storage]
bucket = "ecmwf-viewer"
public_base = "https://pub-07aea3ace26c452cbe6112df32e49088.r2.dev/"
max_bytes = 9_000_000_000               # hard cap: never upload past this (free tier is 10 GB)
max_class_a_per_month = 900_000         # writes + lists; stop uploading before the free 1M
image_cache_control = "public, max-age=86400"
manifest_cache_control = "no-cache, max-age=0"
upload_threads = 16

[output]
format = "png8"                 # png | png8 | webp (decided after M3)
png8_colors = 256
webp_quality = 85
