name: ci

# Branch / PR check: unit tests + a smoke render of a few steps of the latest 00/12Z run (all models).
# Never deploys.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TQDM_DISABLE: "1"
  PYTHONWARNINGS: ignore
  PYTHONUNBUFFERED: "1"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-naturalearth-v1
      - run: pip install -r requirements.lock
      - name: Unit tests
        run: python -m unittest -v
      - name: Smoke render (IFS steps 0, 6, 144, 150, 240; IFS 0.1 and AIFS steps 0, 150)
        run: |
          RUN=$(python -m render latest --main-only)
          python -m render render-run --model ifs --run "$RUN" --steps 0,6,144,150,240 --site smoke-site --work work
          python -m render render-run --model ifs01 --run "$RUN" --steps 0,150 --site smoke-site --work work
          python -m render render-run --model aifs --run "$RUN" --steps 0,150 --site smoke-site --work work
          {
            echo "## Smoke render: run $RUN"
            for m in ifs ifs01 aifs; do
              echo "### $m"
              echo '```json'
              cat smoke-site/$m/$RUN/meta.json
              echo '```'
            done
            echo "Files: $(find smoke-site -type f | wc -l), size: $(du -sh smoke-site | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-site
          path: smoke-site/
          retention-days: 7
