name: ci

# Branch / PR check: unit tests + a smoke render of a few steps of the latest 00/12Z run (all models).
# Never deploys.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TQDM_DISABLE: "1"
  PYTHONWARNINGS: ignore
  PYTHONUNBUFFERED: "1"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-naturalearth-v2
      - run: pip install -r requirements.lock
      - name: Unit tests
        run: python -m unittest -v
      - name: Smoke render (IFS steps 0, 6, 144, 150, 240; IFS 0.1 and AIFS steps 0, 150; KIM regional steps 0, 1, 2, 3, 4, 24 with hourly surface steps)
        env:
          # KIM smoke costs about 120 API Hub requests / 0.3 GB of the 5 GB daily KMA quota, so it runs only on
          # a manual run or a push whose commit message contains [kim] (never on the pull_request duplicate).
          KMA_APIHUB_KEY: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[kim]'))) && secrets.KMA_APIHUB_KEY || '' }}
        run: |
          RUN=$(python -m render latest --main-only --model ifs01)   # 0.1 deg is published last (about +9.7 h)
          python -m render render-run --model ifs --run "$RUN" --steps 0,6,144,150,240 --site smoke-site --work work
          python -m render render-run --model ifs01 --run "$RUN" --steps 0,150 --site smoke-site --work work
          python -m render render-run --model aifs --run "$RUN" --steps 0,150 --site smoke-site --work work
          if [ -n "$KMA_APIHUB_KEY" ]; then          # KIM regional: about 120 API Hub calls (opt-in, see env)
            KRUN=$(date -u -d "yesterday" +%Y%m%d00)
            python -m render render-run --model kimr --run "$KRUN" --steps 0,1,2,3,4,24 --site smoke-site --work work
          fi
          {
            echo "## Smoke render: run $RUN"
            for f in smoke-site/*/*/meta.json; do
              echo "### $f"
              echo '```json'
              cat "$f"
              echo '```'
            done
            echo "Files: $(find smoke-site -type f | wc -l), size: $(du -sh smoke-site | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-site
          path: smoke-site/
          retention-days: 7
