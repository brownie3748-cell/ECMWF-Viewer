name: pages

# Deploy the web viewer (app/www) to GitHub Pages at <pages>/app/. Chart data comes from Cloudflare R2.
# Runs only from main.
on:
  push:
    branches: [main]
    paths:
      - "app/www/**"
      - "NOTICE"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p site/app
          cp -r app/www/. site/app/
          cp NOTICE site/NOTICE.txt
          cat > site/index.html <<'HTML'
          <!doctype html><meta charset=utf-8><title>ECMWF chart viewer</title>
          <meta http-equiv="refresh" content="0; url=app/">
          <p>ECMWF chart viewer: <a href="app/">app/</a>. Licence and attribution: <a href="NOTICE.txt">NOTICE</a>.</p>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
