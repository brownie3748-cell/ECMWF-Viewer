name: measure (Stage 0)

# Stage 0 measurements (manual since Stage 1; ci.yml checks branches). No deploy, no publishing.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Run only this measurement (e.g. m7, m8); empty = all except m8"
        default: ""
      m8_urls:
        description: "M8: KMA API Hub request URL(s) without the authKey (space separated); empty = built-in KIM global + regional set"
        default: ""
      m9_round:
        description: "M9: measurement round (1, 2 or 3)"
        default: "1"
      m10_round:
        description: "M10: measurement round (1 or 2)"
        default: "1"
      m10_urls:
        description: "M10: extra radar / grid URL(s) to try, without the authKey (space separated)"
        default: ""

permissions:
  contents: read

concurrency:
  group: measure-${{ github.ref }}
  cancel-in-progress: true

env:
  STAGE0_WORK: ${{ github.workspace }}/work
  TQDM_DISABLE: "1"
  PYTHONWARNINGS: ignore
  PYTHONUNBUFFERED: "1"

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Cache Natural Earth coastlines (cartopy)
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-naturalearth-v2

      - name: Install (timed)
        run: |
          start=$(date +%s)
          pip install -r requirements.lock
          echo "pip install took $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          nproc; free -h; df -h .

      - name: Install check
        run: python -m measure.install_check

      - name: M1 sources
        if: inputs.only == '' || inputs.only == 'm1'
        continue-on-error: true
        run: python -m measure.m1_sources

      - name: M2 fields
        if: inputs.only == '' || inputs.only == 'm2'
        continue-on-error: true
        run: python -m measure.m2_fields

      - name: M3 render
        if: inputs.only == '' || inputs.only == 'm3'
        continue-on-error: true
        run: python -m measure.m3_render

      - name: M5 MFC sanity
        if: inputs.only == '' || inputs.only == 'm5'
        continue-on-error: true
        run: python -m measure.m5_mfc

      - name: M4 WPSH rule
        if: inputs.only == '' || inputs.only == 'm4'
        continue-on-error: true
        run: python -m measure.m4_wpsh

      - name: M7 per-step publication delay
        if: inputs.only == '' || inputs.only == 'm7'
        continue-on-error: true
        run: python -m measure.m7_stage_delay

      - name: M8 KMA API Hub (KIM regional) reachability and format
        if: inputs.only == 'm8'
        continue-on-error: true
        env:
          KMA_APIHUB_KEY: ${{ secrets.KMA_APIHUB_KEY }}
          M8_URLS: ${{ inputs.m8_urls }}
        run: python -m measure.m8_kma_apihub

      - name: M9 KMA forecast images (ultra-short / short-range)
        if: inputs.only == 'm9'
        continue-on-error: true
        env:
          KMA_APIHUB_KEY: ${{ secrets.KMA_APIHUB_KEY }}
          M9_ROUND: ${{ inputs.m9_round }}
        run: python -m measure.m9_kma_dfs

      - name: M10 radar / forecast-grid sources (강수 비교)
        if: inputs.only == 'm10'
        continue-on-error: true
        env:
          KMA_APIHUB_KEY: ${{ secrets.KMA_APIHUB_KEY }}
          M10_URLS: ${{ inputs.m10_urls }}
          M10_ROUND: ${{ inputs.m10_round }}
        run: python -m measure.m10_radar

      - name: Report to job summary
        if: always()
        run: python -m measure.report | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload results (json + md)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage0-results
          path: work/results/
          retention-days: 14

      - name: Upload sample images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage0-images
          path: work/images/
          retention-days: 14
