name: publish (Stage 1)

# Poll for complete ECMWF runs, render the missing ones, deploy the site to GitHub Pages.
# Idempotent: a run already on the site is never re-rendered. Publishing runs only from main.
on:
  schedule:
    - cron: "7,37 * * * *"        # every 30 min (GitHub cron is best-effort; may be late or skipped)
    - cron: "21 3 * * *"          # daily keepalive tick
  workflow_dispatch:
    inputs:
      time_budget_min:
        description: "Stop starting new runs after this many minutes"
        default: "150"

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  TQDM_DISABLE: "1"
  PYTHONWARNINGS: ignore
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      changed: ${{ steps.poll.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Cache Natural Earth coastlines (cartopy)
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-naturalearth-v1

      - name: Restore previous site
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: site
          key: site-v1-${{ github.run_id }}
          restore-keys: site-v1-

      - name: Install
        run: pip install -r requirements.lock

      - name: Poll, prune, render, manifest
        id: poll
        run: |
          echo "Site restored from cache: ${{ steps.restore.outputs.cache-matched-key || 'none (runs will be re-rendered from the mirrors)' }}" >> "$GITHUB_STEP_SUMMARY"
          python -m render poll --site site --work work --time-budget-min "${{ inputs.time_budget_min || '150' }}"

      - name: Save site
        if: steps.poll.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: site
          key: site-v1-${{ github.run_id }}

      - name: Upload Pages artifact
        if: steps.poll.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  keepalive:
    # Scheduled workflows are disabled after 60 days without repository activity.
    # Re-enabling through the API is meant to reset that timer (UNVERIFIED, see docs/STAGE1.md).
    if: github.ref == 'refs/heads/main' && github.event.schedule == '21 3 * * *'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/publish.yml/enable"
