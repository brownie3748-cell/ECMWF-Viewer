name: publish

# Poll for complete ECMWF runs of every model (IFS 0.25, IFS 0.1, AIFS), render the missing ones and
# upload them to Cloudflare R2, with a hard storage cap (render/config.toml [storage]).
# Idempotent: a run already in the bucket is not re-rendered. Publishing runs only from main.
# The web app itself is deployed to GitHub Pages by pages.yml.
on:
  schedule:
    - cron: "7,37 * * * *"        # every 30 min (GitHub cron is best-effort; may be late or skipped)
    - cron: "21 3 * * *"          # daily keepalive tick
  workflow_dispatch:
    inputs:
      time_budget_min:
        description: "Stop starting new runs after this many minutes"
        default: "150"

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  TQDM_DISABLE: "1"
  PYTHONWARNINGS: ignore
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Cache Natural Earth coastlines (cartopy)
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-naturalearth-v1

      - name: Install
        run: pip install -r requirements.lock

      - name: Poll, render, upload to R2, prune, manifest
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m render poll --store r2 --work work --time-budget-min "${{ inputs.time_budget_min || '150' }}"

      - name: Check the public URL (index.json + CORS)
        if: always()
        run: |
          BASE=$(python -c "from render import config; print(config.load()['storage']['public_base'])")
          {
            echo "## Public URL check"
            echo '```'
            curl -sS -D - -o /tmp/index.json -H "Origin: https://brownie3748-cell.github.io" "${BASE}index.json" \
              | grep -iE "^(HTTP|content-type|cache-control|access-control-allow-origin)" || true
            echo '```'
            python -c "import json; m=json.load(open('/tmp/index.json')); print('Runs per model:', {x['id']: len(x['runs']) for x in m['models']})" || true
          } >> "$GITHUB_STEP_SUMMARY"

  keepalive:
    # Scheduled workflows are disabled after 60 days without repository activity.
    # Re-enabling through the API is meant to reset that timer (UNVERIFIED, see docs/STAGE1.md).
    if: github.ref == 'refs/heads/main' && github.event.schedule == '21 3 * * *'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/publish.yml/enable"
