name: forecast

# KMA forecast images for the "예보" tab (초단기예보 / 단기예보 from the KMA API Hub), copied to R2 under dfs/.
# Own schedule and concurrency group: a two-hour KIM run in publish.yml never holds it back. Main only.
on:
  schedule:
    - cron: "19,49 * * * *"       # every 30 min (best effort): 초단기 from HH:15, 단기 from about HH:40 after issuance
  workflow_dispatch:
    inputs:
      force:
        description: "Fetch the newest issuances even if already published"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: forecast
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  fetch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: pip install -r requirements.lock
      - name: Fetch, upload to R2, prune, dfs/index.json
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          KMA_APIHUB_KEY: ${{ secrets.KMA_APIHUB_KEY }}
        run: python -m render dfs --store r2 ${{ inputs.force && '--force' || '' }}
